<!DOCTYPE html>
<html>
    <head>
        <title>💻Cozy Work Hub💻</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <p id="clock"></p>
        <h1>🌷Aezy Cozy Website🌷</h1>
        <h2>💻Cozy Work Hub💻</h2>
        <p>Your Work Essentials in one place!</p>
        <hr>
        <input type="text" id="search" class="searchBar" placeholder="Search Work Tools..." onkeyup="searchWork()">
        <hr>
        <h3>📧 Communication</h3>
        <button class="workButton" onclick="openGmail()">Gmail</button>
        <button class="workButton" onclick="openOutlook()">Outlook</button>
        <button class="workButton" onclick="openZoom()">Zoom</button>
        <button class="workButton" onclick="openGoogleMeet()">Google Meet</button>
        <button class="workButton" onclick="openTeams()">Teams</button>
        <button class="workButton" onclick="openSlash()">Slash</button>
        <button class="workButton" onclick="openDiscord()">Discord</button>
        <button class="workButton" onclick="openWhatsappWeb()">Whatsapp Web</button>
        <button class="workButton" onclick="openTelegramWeb()">Telegram Web</button>
        <button class="workButton" onclick="openSkype()">Skype</button>
        <hr>
        <h3>📄 Office Tools</h3>
        <button class="workButton" onclick="openGoogleDocs()">Google Docs</button>
        <button class="workButton" onclick="openGoogleSheets()">Google Sheets</button>
        <button class="workButton" onclick="openGoogleSlides()">Google Slides</button>
        <button class="workButton" onclick="openMicrosoftWord()">Microsoft Word</button>
        <button class="workButton" onclick="openMicroftExcel()">Microsoft Excel</button>
        <button class="workButton" onclick="openMicrosoftPowerPoint()">Microsoft PowerPoint</button>
        <button class="workButton" onclick="openCanva()">Canva</button>
        <button class="workButton" onclick="openNotion()">Notion</button>
        <button class="workButton" onclick="openAdobeExpress()">Adobe Express</button>
        <button class="workButton" onclick="openDropbox()">Dropbox</button>
        <hr>
        <h3>☁️ File Storage & Productivity</h3>
        <button class="workButton" onclick="openGoogleDrive()">Google Drive</button>
        <button class="workButton" onclick="openOneDrive()">OneDrive</button>
        <button class="workButton" onclick="openDropbox()">Dropbox</button>
        <button class="workButton" onclick="openGoogleCalendar()">Google Calendar</button>
        <button class="workButton" onclick="openGoogleKeep()">Google Keep</button>
        <button class="workButton" onclick="openTodoist()">Todoist</button>
        <button class="workButton" onclick="openTrello()">Trello</button>
        <button class="workButton" onclick="openAsana()">Asana</button>
        <button class="workButton" onclick="openClickUp()">ClickUp</button>
        <button class="workButton" onclick="openEvernote()">Evernote</button>
        <script src="script.js"></script>
    </body>
</html>
